<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Google | CommandSite</title>
<link rel="icon" href="/favicon.png" />
<style>
  /* Landing page for the OAuth popup. google-oauth-callback redirects here with
     ?status=ok|error&title=...&detail=... because a Supabase Edge Function cannot
     serve text/html (the platform rewrites it to text/plain). This page lives on
     our own domain, so it renders normally. */
  :root {
    color-scheme: light;
    --ink: #0f172a;
    --muted: #64748b;
    --divider: #e2e8f0;
    --surface: #f4f7fb;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff; border: 1px solid var(--divider); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .07);
    padding: 36px 40px; max-width: 460px; width: 100%; text-align: center;
  }
  .logo { height: 30px; width: auto; margin: 0 auto 22px; display: block; }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  h1.ok { color: var(--ok); }
  h1.error { color: var(--err); }
  p { color: var(--muted); line-height: 1.55; margin: 8px 0 0; font-size: 14.5px; }
  button {
    margin-top: 24px; width: 100%;
    background: var(--ink); color: #fff; border: 0;
    padding: 12px 24px; border-radius: 9px;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1e293b; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="CommandSite" />
    <div class="icon" id="icon">✅</div>
    <h1 id="title" class="ok">Google connected</h1>
    <p id="detail">You can close this tab.</p>
    <button type="button" id="close">Close tab</button>
    <p class="hint" id="hint">If this tab does not close, just close it manually. The dashboard has already updated.</p>
  </div>

<script>
  (function () {
    var q = new URLSearchParams(window.location.search)
    var isError = q.get('status') === 'error'
    var title = q.get('title')
    var detail = q.get('detail')

    var titleEl = document.getElementById('title')
    var detailEl = document.getElementById('detail')

    document.getElementById('icon').textContent = isError ? '⚠️' : '✅'
    titleEl.className = isError ? 'error' : 'ok'

    // textContent, never innerHTML: title and detail come from the query string,
    // so treating them as markup would make this page an XSS sink on our domain.
    if (title) titleEl.textContent = title
    else if (isError) titleEl.textContent = 'Something went wrong'

    if (detail) detailEl.textContent = detail

    document.title = (isError ? 'Problem' : 'Connected') + ' | CommandSite'

    document.getElementById('close').addEventListener('click', function () {
      window.close()
    })
  })()
</script>
</body>
</html>
